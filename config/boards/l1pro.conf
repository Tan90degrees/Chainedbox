# Chainedbox L1 Pro (Rockchip RK3328); based on the upstream Rock64 profile.
BOARD_NAME="L1 Pro"
BOARD_VENDOR="community"
BOARDFAMILY="rockchip64"
BOOTCONFIG="rock64-rk3328_defconfig"
KERNEL_TARGET="current,edge"
FULL_DESKTOP="no"
BOOT_SCENARIO="blobless"
# Build with the upstream RK3328 DTB. Repack sets the device-specific DTB at boot.
BOOT_FDT_FILE="rockchip/rk3328-rock64.dtb"
