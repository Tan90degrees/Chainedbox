name: Build Chainedbox Armbian (stable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      armbianBoard:
        description: "Target board"
        type: choice
        required: true
        default: l1pro
        options: [l1pro, chainedbox]
      armbianBranch:
        description: "Kernel branch (current is the stable baseline)"
        type: choice
        required: true
        default: current
        options: [current, edge]
      armbianRelease:
        description: "Userspace distribution"
        type: choice
        required: true
        default: noble
        options: [noble, trixie]
      cpuFrequency:
        description: "Device-tree CPU frequency"
        type: choice
        required: true
        default: 1296mhz
        options: [1296mhz, 1392mhz, 1512mhz]
      dtbSource:
        description: "Board-specific DTB source (ophub is experimental)"
        type: choice
        required: true
        default: legacy
        options: [legacy, ophub]
      publishRelease:
        description: "Publish successful image to GitHub Releases"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "0 17 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration and scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository assets
        shell: bash
        run: |
          set -euo pipefail
          bash -n rebuild-5.15.y.sh
          for board in l1pro chainedbox; do
            test -s "config/boards/${board}.conf"
          done
          for source in legacy ophub; do
            for freq in 1296mhz 1392mhz 1512mhz; do
              test -s "dtbs/${source}/rk3328-l1pro-${freq}.dtb"
              test "$(od -An -tx1 -N4 "dtbs/${source}/rk3328-l1pro-${freq}.dtb" | tr -d ' \n')" = "d00dfeed"
            done
          done
          for part in idbloader.bin uboot.img trust.bin; do
            test -s "loader/${part}"
          done
          test -s patches/kernel/rockchip64-6.18/media-0008-vsi-iommu-attach-dev-api.patch
          grep -q "struct iommu_domain \*old" patches/kernel/rockchip64-6.18/media-0008-vsi-iommu-attach-dev-api.patch
          echo "Repository build assets validated."

  build:
    name: Build and package Armbian image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      ARMBIAN_BUILD_REF: v26.5.1
      ARMBIAN_BOARD: ${{ inputs.armbianBoard || 'l1pro' }}
      ARMBIAN_BRANCH: ${{ inputs.armbianBranch || 'current' }}
      ARMBIAN_RELEASE: ${{ inputs.armbianRelease || 'noble' }}
      CPU_FREQUENCY: ${{ inputs.cpuFrequency || '1296mhz' }}
      DTB_SOURCE: ${{ inputs.dtbSource || 'legacy' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Ubuntu 24.04 build host
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners are disk-constrained; leave system packages intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git ca-certificates util-linux u-boot-tools e2fsprogs device-tree-compiler
          df -h .
          free -h

      - name: Fetch pinned stable Armbian framework
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ARMBIAN_BUILD_REF" https://github.com/armbian/build.git build
          cp config/boards/l1pro.conf config/boards/chainedbox.conf build/config/boards/
          # The pinned Armbian 6.18 rockchip64 patch adds vsi-iommu.c with the old
          # two-argument attach_dev callbacks. Overlay the minimal API fix on top.
          upstream_patch="build/patch/kernel/archive/rockchip64-6.18/media-0007-add-verisilicon-AV1-iommu-driver.patch"
          custom_patch="patches/kernel/rockchip64-6.18/media-0008-vsi-iommu-attach-dev-api.patch"
          test -s "$upstream_patch"
          test -s "$custom_patch"
          # Ensure our patch sorts AFTER the upstream patch that creates vsi-iommu.c.
          [[ "$(basename "$custom_patch")" > "$(basename "$upstream_patch")" ]] || {
            echo "::error::VSI IOMMU patch must be applied after the upstream driver is created"
            exit 1
          }
          # Preflight against the exact file introduced by the pinned Armbian patch.
          # This catches both patch format errors and API drift before a long kernel build.
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/drivers/iommu"
          awk '
            $0 == "+++ b/drivers/iommu/vsi-iommu.c" { in_file=1; next }
            in_file && /^diff --git / { exit }
            in_file && /^\+/ { print substr($0,2) }
          ' "$upstream_patch" > "$tmp/drivers/iommu/vsi-iommu.c"
          test -s "$tmp/drivers/iommu/vsi-iommu.c"
          patch --batch --dry-run -p1 -d "$tmp" < "$custom_patch"
          rm -rf "$tmp"
          mkdir -p build/userpatches/kernel/archive/rockchip64-6.18
          cp patches/kernel/rockchip64-6.18/*.patch build/userpatches/kernel/archive/rockchip64-6.18/
          ls -l build/userpatches/kernel/archive/rockchip64-6.18/
          test -x build/compile.sh || chmod +x build/compile.sh
          echo "Armbian build ref: $(git -C build describe --tags --always)"

      # Armbian builds arm64 rootfs in a Docker container on an amd64 host.
      # binfmt_misc must be registered on the runner host before Docker starts:
      # container-local update-binfmts cannot initialize the host kernel.
      - name: Register QEMU for ARM64 chroot
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.0.4
          platforms: arm64,arm
          cache-image: false

      - name: Verify ARM64 emulation before compiling
        shell: bash
        run: |
          set -euo pipefail
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64 || {
            echo "::error::qemu-aarch64 binfmt handler was not registered on the host"
            exit 1
          }
          grep -q '^enabled' /proc/sys/fs/binfmt_misc/qemu-aarch64
          grep -Eq '^flags:.*F' /proc/sys/fs/binfmt_misc/qemu-aarch64
          arch="$(docker run --rm --platform linux/arm64 alpine:3.22 uname -m)"
          test "$arch" = aarch64 || {
            echo "::error::ARM64 QEMU smoke test failed: uname -m returned $arch"
            exit 1
          }
          echo "ARM64 binfmt and real arm64 container execution verified."

      - name: Compile Armbian
        shell: bash
        run: |
          set -euo pipefail
          cd build
          ./compile.sh build \
            BOARD="$ARMBIAN_BOARD" \
            BRANCH="$ARMBIAN_BRANCH" \
            RELEASE="$ARMBIAN_RELEASE" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=img

      - name: Upload Armbian build logs when compilation fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: armbian-failure-logs-${{ github.run_number }}
          path: build/output/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Customize Chainedbox image and checksums
        shell: bash
        run: |
          set -euo pipefail
          sudo bash ./rebuild-5.15.y.sh "$CPU_FREQUENCY" "$ARMBIAN_BOARD" "$DTB_SOURCE"
          cd build/output/images
          shopt -s nullglob
          images=( *.img.gz )
          (( ${#images[@]} == 1 )) || { echo "::error::Expected exactly one .img.gz image"; exit 1; }
          sha256sum -c "${images[0]}.sha256"
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"

      - name: Upload built image
        uses: actions/upload-artifact@v7
        with:
          name: armbian-${{ env.ARMBIAN_BUILD_REF }}-${{ env.ARMBIAN_BOARD }}-${{ env.DTB_SOURCE }}-${{ env.CPU_FREQUENCY }}-${{ github.run_number }}
          path: |
            build/output/images/*.img.gz
            build/output/images/*.sha256
            build/output/images/*.dtb
            build/output/images/*.dts
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub pre-release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publishRelease == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: chainedbox-${{ env.ARMBIAN_BUILD_REF }}-${{ env.ARMBIAN_BOARD }}-${{ env.DTB_SOURCE }}-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: Chainedbox Armbian ${{ env.ARMBIAN_BUILD_REF }} (${{ env.ARMBIAN_BOARD }}, ${{ env.DTB_SOURCE }} DTB)
          files: |
            build/output/images/*.img.gz
            build/output/images/*.sha256
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Pre-release image. Hardware boot validation has NOT been performed.
            Built from pinned Armbian framework ${{ env.ARMBIAN_BUILD_REF }}.
            Board: ${{ env.ARMBIAN_BOARD }}; kernel branch: ${{ env.ARMBIAN_BRANCH }}; OS: ${{ env.ARMBIAN_RELEASE }}; DTB frequency: ${{ env.CPU_FREQUENCY }}; DTB source: ${{ env.DTB_SOURCE }}.
            Warning: The image uses the selected board DTB (legacy or ophub), but the historical Chainedbox bootloaders remain. Hardware boot, eMMC, Ethernet, HDD power and fan behavior must be tested before production use.
            The accompanying DTS is generated by decompiling the selected DTB with dtc, not copied from ophub source code.
