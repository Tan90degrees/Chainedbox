name: Build Chainedbox Armbian (stable)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      armbianBoard:
        description: "Target board"
        type: choice
        required: true
        default: l1pro
        options: [l1pro, chainedbox]
      armbianBranch:
        description: "Kernel branch (current is the stable baseline)"
        type: choice
        required: true
        default: current
        options: [current, edge]
      armbianRelease:
        description: "Userspace distribution"
        type: choice
        required: true
        default: noble
        options: [noble, trixie]
      cpuFrequency:
        description: "Device-tree CPU frequency"
        type: choice
        required: true
        default: 1296mhz
        options: [1296mhz, 1392mhz, 1512mhz]
      publishRelease:
        description: "Publish successful image to GitHub Releases"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "0 17 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration and scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate repository assets
        shell: bash
        run: |
          set -euo pipefail
          for script in rebuild-5.15.y.sh rebuild-5.10.y.sh; do
            bash -n "$script"
          done
          for board in l1pro chainedbox; do
            test -s "config/boards/${board}.conf"
          done
          for freq in 1296mhz 1392mhz 1512mhz; do
            test -s "dtbs/5.15.y-bsp/rk3328-l1pro-${freq}.dtb"
          done
          for part in idbloader.bin uboot.img trust.bin; do
            test -s "loader/${part}"
          done
          echo "Repository build assets validated."

  build:
    name: Build and package Armbian image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      ARMBIAN_BUILD_REF: v26.5.1
      ARMBIAN_BOARD: ${{ inputs.armbianBoard || 'l1pro' }}
      ARMBIAN_BRANCH: ${{ inputs.armbianBranch || 'current' }}
      ARMBIAN_RELEASE: ${{ inputs.armbianRelease || 'noble' }}
      CPU_FREQUENCY: ${{ inputs.cpuFrequency || '1296mhz' }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prepare Ubuntu 24.04 build host
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runners are disk-constrained; leave system packages intact.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git ca-certificates util-linux u-boot-tools e2fsprogs
          df -h .
          free -h

      - name: Fetch pinned stable Armbian framework
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ARMBIAN_BUILD_REF" https://github.com/armbian/build.git build
          cp config/boards/l1pro.conf config/boards/chainedbox.conf build/config/boards/
          test -x build/compile.sh || chmod +x build/compile.sh
          echo "Armbian build ref: $(git -C build describe --tags --always)"

      - name: Compile Armbian
        shell: bash
        run: |
          set -euo pipefail
          cd build
          ./compile.sh build \
            BOARD="$ARMBIAN_BOARD" \
            BRANCH="$ARMBIAN_BRANCH" \
            RELEASE="$ARMBIAN_RELEASE" \
            BUILD_MINIMAL=no \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE=img

      - name: Customize Chainedbox image and checksums
        shell: bash
        run: |
          set -euo pipefail
          sudo bash ./rebuild-5.15.y.sh "$CPU_FREQUENCY" "$ARMBIAN_BOARD"
          cd build/output/images
          shopt -s nullglob
          images=( *.img.gz )
          (( ${#images[@]} == 1 )) || { echo "::error::Expected exactly one .img.gz image"; exit 1; }
          sha256sum -c "${images[0]}.sha256"
          echo "BUILD_DATE=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_ENV"

      - name: Upload built image
        uses: actions/upload-artifact@v7
        with:
          name: armbian-${{ env.ARMBIAN_BUILD_REF }}-${{ env.ARMBIAN_BOARD }}-${{ env.CPU_FREQUENCY }}-${{ github.run_number }}
          path: |
            build/output/images/*.img.gz
            build/output/images/*.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish GitHub pre-release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publishRelease == true)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: chainedbox-${{ env.ARMBIAN_BUILD_REF }}-${{ env.ARMBIAN_BOARD }}-${{ env.BUILD_DATE }}-${{ github.run_number }}
          name: Chainedbox Armbian ${{ env.ARMBIAN_BUILD_REF }} (${{ env.ARMBIAN_BOARD }})
          files: |
            build/output/images/*.img.gz
            build/output/images/*.sha256
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          body: |
            Pre-release image. Hardware boot validation has NOT been performed.
            Built from pinned Armbian framework ${{ env.ARMBIAN_BUILD_REF }}.
            Board: ${{ env.ARMBIAN_BOARD }}; kernel branch: ${{ env.ARMBIAN_BRANCH }}; OS: ${{ env.ARMBIAN_RELEASE }}; DTB frequency: ${{ env.CPU_FREQUENCY }}.
            Warning: RK3328 board-specific DTBs and bootloader are preserved from this repository; hardware boot and fan behavior must be tested before production use.
